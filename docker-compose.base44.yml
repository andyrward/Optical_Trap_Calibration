services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.base44
    container_name: optical_trap_calibration
    working_dir: /app
    volumes:
      # Bind-mount the source so edits hot-reload via uvicorn --reload.
      - ./:/app
    ports:
      - "3000:3000"
    command: ["bash", "/app/start.base44.sh"]
